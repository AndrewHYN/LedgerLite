name: LedgerLite Quality Gate
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  django:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      DEBUG: "true"
      SECRET_KEY: "ci-only-not-a-production-secret"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Python syntax
        run: python -m compileall -q invoicepro invoices accounts
      - name: Django configuration
        run: python manage.py check
      - name: Optional Cloudinary settings load
        env:
          CLOUDINARY_CLOUD_NAME: placeholder
          CLOUDINARY_API_KEY: placeholder
          CLOUDINARY_API_SECRET: placeholder
        run: python manage.py check
      - name: Collect static files
        run: python manage.py collectstatic --noinput
      - name: Model migration drift
        run: python manage.py makemigrations --check --dry-run
      - name: Regression tests
        run: python manage.py test invoices -v 2
