name: LedgerLite Quality Gate
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  django:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      DEBUG: "true"
      SECRET_KEY: "ci-only-not-a-production-secret"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Python syntax
        run: python -m compileall -q invoicepro invoices accounts
      - name: Django configuration
        run: python manage.py check
      - name: Regression tests
        run: python manage.py test invoices -v 2
